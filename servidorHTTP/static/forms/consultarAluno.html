<!DOCTYPE html>
<html lang="pt-br">

<head>

    <title>Consultar Aluno</title>
    <link rel="stylesheet" href="../styles/consultarAluno.style.css">
</head>

<body>

        <h3>Consultar Aluno</h3>

    </div>

</body>

</html>
