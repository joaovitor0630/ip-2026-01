<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remover Aluno</title>
    <link rel="stylesheet" href="../styles/removerAluno.style.css">
</head>

<body>
    <div id="container">
        <h3>Remover Aluno</h3>
        <form method="POST" action="/remover">
            <div>
                <label>Matrícula:</label>
                <input name="matricula" placeholder="Digite a matrícula do aluno" type="text" required>
            </div>
            <button type="submit"><span>Remover Aluno</span></button>
        </form>
    </div>
</body>

</html>
